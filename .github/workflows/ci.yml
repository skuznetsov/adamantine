name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: Install locked dependencies
        run: shards install --frozen

      - name: Check formatting, build, and test
        run: make ci

      - name: Build release binary
        run: crystal build src/adamantine.cr --release -o /tmp/adamantine

      - name: Smoke-test CLI
        run: /tmp/adamantine --help
